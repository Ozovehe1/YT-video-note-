name: Build Android APK

# Builds the Verbatim phone helper into an installable debug APK in the cloud
# (the user is phone-only). Download the artifact from the run and sideload it.
on:
  push:
    branches: ['main', 'claude/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Needed so the workflow can publish a Release with the APK attached.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Release, not debug. A debug APK is built with android:debuggable=true, which lets anyone
      # with USB debugging read the app's private storage — where the Supabase refresh token and
      # the agent token live. It's signed with the same committed key as before, so it installs
      # straight over an existing debug-signed install with no uninstall.
      - name: Build release APK
        env:
          # Each run gets an increasing versionCode so installs register as updates.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/verbatim.apk"

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: verbatim-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Publish the APK to a fixed "android-latest" Release so it's a permanent,
      # one-tap download that doesn't expire (unlike build artifacts). The tag is
      # reused every build, so the download link stays the same.
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Verbatim phone helper (latest)
          body: |
            Latest Verbatim APK (release build, armeabi-v7a, signed with the project's fixed key).
            Tap `verbatim.apk` below to download, then sideload it.
          files: verbatim.apk
          fail_on_unmatched_files: true
