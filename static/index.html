<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Video Note</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>YT Video Note</h1>
      <p class="tagline">Paste a YouTube link — get a complete note that mirrors the video's structure, whether it's a one-person monologue or a conversation.</p>
    </header>

    <form id="note-form">
      <input
        id="url-input"
        type="text"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off"
        required
      >
      <button id="submit-btn" type="submit">Make note</button>
    </form>

    <div id="status" class="hidden"></div>

    <section id="result" class="hidden">
      <div class="result-header">
        <div class="result-meta">
          <span id="badge" class="badge"></span>
          <span id="video-title"></span>
        </div>
        <div class="result-actions">
          <button id="copy-btn" type="button">Copy markdown</button>
          <button id="download-btn" type="button">Download .md</button>
        </div>
      </div>
      <article id="note"></article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
