plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.verbatim.helper'
    compileSdk 34

    // A FIXED signing key (committed) so every build shares one signature. That lets a new
    // APK install right over the old one — no uninstall — and is what makes auto-update work.
    signingConfigs {
        debug {
            storeFile file("verbatim-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.verbatim.helper"
        // youtubedl-android needs 24; supabase-kt needs 26 → 26 satisfies both. The target
        // device (Infinix Smart 9, Android 14 Go) is far newer, so nothing real is lost.
        minSdk 26
        targetSdk 34
        // Version comes from CI (the run number) so each build is a proper, increasing update;
        // falls back to 1 for local builds.
        versionCode (System.getenv("VERSION_CODE")?.toInteger() ?: 1)
        versionName (System.getenv("VERSION_NAME") ?: "1.0")

        // Ship 32-bit ARM (armeabi-v7a) only — the smallest APK that installs on EVERY
        // ARM Android phone: 32-bit devices run it natively, and 64-bit devices run
        // 32-bit apps in compat mode. The target device (Infinix Smart 9, X6532, Android
        // 14 Go edition) runs a 32-bit OS on a 64-bit-capable chip, so a 64-bit-only APK
        // was rejected as "not compatible".
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        // Pairs with Kotlin 1.9.24 (see root build.gradle).
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            // We ship the debug variant for v1; release kept unsigned/simple.
        }
    }

    // youtubedl-android bundles a Python runtime + native libs. These excludes
    // avoid duplicate-file merge failures from the bundled archives.
    packagingOptions {
        resources {
            pickFirsts += ['**/libpython*.so', '**/libc++_shared.so']
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.md',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.md',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module',
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties'
            ]
        }
        // The Python interpreter dlopen's its libs from the extracted path.
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // --- phone-side downloader (unchanged) ---
    def ytdl = "0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:library:$ytdl"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$ytdl"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // --- Kotlin / Android core ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // --- Room: on-device cache (local-first reads, offline note reading) ---
    def room = "2.6.1"
    implementation "androidx.room:room-runtime:$room"
    implementation "androidx.room:room-ktx:$room"
    ksp "androidx.room:room-compiler:$room"

    // --- Jetpack Compose (the native UI) ---
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
